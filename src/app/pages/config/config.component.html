<section class="config-container">
  @if (loading()) {
    <div class="config-loading">
      <app-spinner [diameter]="48" />
    </div>
  } @else {
    @if (user(); as u) {
      <article id="user-profile" class="config-card">
        <h2 class="config-card__title">Perfil de usuario</h2>
        <div class="config-profile">
          <img class="config-profile__avatar" [src]="u.picture" [alt]="u.firstName + ' ' + u.lastName" />
          <div class="config-profile__info">
            <h3 class="config-profile__name">{{ u.firstName }} {{ u.lastName }}</h3>
            <div class="config-profile__row">
              <mat-icon>email</mat-icon>
              <span>{{ u.email }}</span>
            </div>
            <div class="config-profile__row">
              <mat-icon>phone</mat-icon>
              <span>{{ u.phone }}</span>
            </div>
            <div class="config-profile__row">
              <mat-icon>location_on</mat-icon>
              <span>{{ u.country }} - {{ u.state }} - {{ u.city }}</span>
            </div>
          </div>
        </div>
      </article>

      <article class="config-card">
        <h2 class="config-card__title">Acciones</h2>
        <div class="config-actions">
          <button class="config-action-btn config-action-btn--danger" (click)="openLogoutModal()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
          </button>
          <button class="config-action-btn" (click)="openAppInfoModal()">
            <mat-icon>info</mat-icon>
            <span>Acerca de</span>
          </button>
        </div>
      </article>
    }
  }
</section>

@if (showLogoutModal()) {
  <app-modal
    variant="danger"
    message="¿Estás seguro de que deseas cerrar sesión?"
    confirmLabel="Cerrar sesión"
    cancelLabel="Cancelar"
    (closed)="closeLogoutModal()"
    (confirmed)="confirmLogout()"
  />
}

@if (showAppInfoModal()) {
  <div class="app-info-backdrop" (click)="closeAppInfoModal()">
    <div class="app-info-popup" (click)="$event.stopPropagation()">
      <button class="app-info-popup__close" (click)="closeAppInfoModal()">
        <mat-icon>close</mat-icon>
      </button>
      <app-app-info />
    </div>
  </div>
}
