<div class="app-info">
  <div class="app-info__header">
    <img class="app-info__logo" src="logo.png" alt="Logo" />
    <div class="app-info__name-version">
      <h3 class="app-info__name">{{ appName }}</h3>
      <span class="app-info__version">v{{ appVersion }}</span>
    </div>
  </div>
  <div class="app-info__agent">
    <mat-icon>devices</mat-icon>
    <span class="app-info__agent-text">{{ userAgent }}</span>
  </div>
</div>
