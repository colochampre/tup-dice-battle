<div class="modal-backdrop" (click)="onClose()">
  <div class="modal" [class]="'modal--' + style()" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <mat-icon class="modal__icon">{{ icon }}</mat-icon>
      <button mat-icon-button class="modal__close" (click)="onClose()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <p class="modal__message">{{ message() }}</p>
  </div>
</div>
