<div class="modal-backdrop" (click)="onClose()">
  <div class="modal" [class]="'modal--' + variant()" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <mat-icon class="modal__icon">{{ icon }}</mat-icon>
      <button mat-icon-button class="modal__close" (click)="onClose()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <p class="modal__message">{{ message() }}</p>
    @if (confirmLabel()) {
      <div class="modal__actions">
        <button mat-button (click)="onClose()">{{ cancelLabel() || 'Cancelar' }}</button>
        <button mat-flat-button color="warn" (click)="onConfirm()">{{ confirmLabel() }}</button>
      </div>
    }
  </div>
</div>
